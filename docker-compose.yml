services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: info
      STORE_DRIVER: postgres
      DATABASE_URL: postgres://aihay:aihay@postgres:5432/aihay
      REDIS_URL: redis://redis:6379
      AIHAY_KEY_PEPPER: ${AIHAY_KEY_PEPPER:-change-me-in-production}
      AIHAY_DEV_KEY: ${AIHAY_DEV_KEY:-sk-aihay-dev-local}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      FEATURE_CONTROL_PLANE: ${FEATURE_CONTROL_PLANE:-true}
      FEATURE_METRICS: ${FEATURE_METRICS:-true}
      FEATURE_COMPLETION_LOGS: ${FEATURE_COMPLETION_LOGS:-true}
      FEATURE_ALIASES: ${FEATURE_ALIASES:-true}
      FEATURE_BUDGETS: ${FEATURE_BUDGETS:-true}
      FEATURE_BYOK: ${FEATURE_BYOK:-false}
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-}
      FEATURE_CREDITS: ${FEATURE_CREDITS:-false}
      CREDITS_BYOK_BYPASS: ${CREDITS_BYOK_BYPASS:-true}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FEATURE_TOOLS_VISION: ${FEATURE_TOOLS_VISION:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEFAULT_MAX_TOKENS: "4096"
      DEFAULT_RPM: "60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Dashboard — enable with: docker compose --profile full up -d
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      AIHAY_API_URL: http://api:3000
      PORT: "3001"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihay
      POSTGRES_PASSWORD: aihay
      POSTGRES_DB: aihay
    ports:
      - "5432:5432"
    volumes:
      - aihay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihay -d aihay"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  aihay_pg:
